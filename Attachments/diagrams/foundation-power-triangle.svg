<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">AC power triangle</title><desc id="desc">Right triangle with real power P horizontal to the right, positive reactive power Q vertical upwards, and apparent power S along the hypotenuse. Angle theta is between P and S.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="30" y="36" font-size="24" text-anchor="start" fill="#182839">AC power triangle</text><line x1="130" y1="330" x2="610" y2="330" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><line x1="610" y1="330" x2="610" y2="110" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><line x1="130" y1="330" x2="610" y2="110" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="365" font-size="20" text-anchor="middle" fill="#182839">P = VI cos θ (W)</text><text x="630" y="210" font-size="18" text-anchor="start" fill="#182839">Q = VI sin θ</text><text x="630" y="236" font-size="18" text-anchor="start" fill="#182839">(VAr)</text><text x="310" y="195" font-size="20" text-anchor="start" fill="#182839">S = VI (VA)</text><path d="M 200 330 A 70 70 0 0 0 194 301" fill="none" stroke="#34495e" stroke-width="2"/><text x="214" y="315" font-size="20" text-anchor="start" fill="#182839">θ</text><path d="M 590 330 L 590 310 L 610 310" fill="none" stroke="#34495e" stroke-width="2"/><text x="32" y="408" font-size="18" text-anchor="start" fill="#182839">Inductive load: Q &gt; 0.  S² = P² + Q²; power factor = P/S = cos θ.</text></g></svg>