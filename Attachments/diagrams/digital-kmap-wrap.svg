<svg xmlns="http://www.w3.org/2000/svg" width="650" height="500" viewBox="0 0 650 500" role="img" aria-labelledby="title desc"><title id="title">Karnaugh-map wraparound grouping</title><desc id="desc">Three-variable map in Gray order. Minterms 0 and 2 wrap across the row boundary, producing not A and not C. Minterms 3 and 7 form a vertical pair, producing B and C.</desc><rect width="100%" height="100%" fill="white"/><text x="30" y="35" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="start">K-map: F = Σm(0, 2, 3, 7)</text><text x="30" y="65" font-family="sans-serif" font-size="17" fill="#172b4d" text-anchor="start">Gray-code columns keep neighbours one bit apart.</text><text x="60" y="112" font-family="sans-serif" font-size="18" fill="#172b4d" text-anchor="start">A / BC</text><text x="170" y="112" font-family="sans-serif" font-size="20" fill="#172b4d" text-anchor="middle">00</text><text x="270" y="112" font-family="sans-serif" font-size="20" fill="#172b4d" text-anchor="middle">01</text><text x="370" y="112" font-family="sans-serif" font-size="20" fill="#172b4d" text-anchor="middle">11</text><text x="470" y="112" font-family="sans-serif" font-size="20" fill="#172b4d" text-anchor="middle">10</text><text x="80" y="173" font-family="sans-serif" font-size="20" fill="#172b4d" text-anchor="start">0</text><rect x="120" y="130" width="100" height="80" fill="#dbeafe" stroke="#64748b"/><text x="170" y="177" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">1</text><text x="128" y="148" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m0</text><rect x="220" y="130" width="100" height="80" fill="#f8fafc" stroke="#64748b"/><text x="270" y="177" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">0</text><text x="228" y="148" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m1</text><rect x="320" y="130" width="100" height="80" fill="#dcfce7" stroke="#64748b"/><text x="370" y="177" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">1</text><text x="328" y="148" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m3</text><rect x="420" y="130" width="100" height="80" fill="#dbeafe" stroke="#64748b"/><text x="470" y="177" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">1</text><text x="428" y="148" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m2</text><text x="80" y="253" font-family="sans-serif" font-size="20" fill="#172b4d" text-anchor="start">1</text><rect x="120" y="210" width="100" height="80" fill="#f8fafc" stroke="#64748b"/><text x="170" y="257" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">0</text><text x="128" y="228" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m4</text><rect x="220" y="210" width="100" height="80" fill="#f8fafc" stroke="#64748b"/><text x="270" y="257" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">0</text><text x="228" y="228" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m5</text><rect x="320" y="210" width="100" height="80" fill="#dcfce7" stroke="#64748b"/><text x="370" y="257" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">1</text><text x="328" y="228" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m7</text><rect x="420" y="210" width="100" height="80" fill="#f8fafc" stroke="#64748b"/><text x="470" y="257" font-family="sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">0</text><text x="428" y="228" font-family="sans-serif" font-size="12" fill="#172b4d" text-anchor="start">m6</text><rect x="325" y="135" width="90" height="150" rx="15" fill="none" stroke="#15803d" stroke-width="3"/><path d="M 155 135 H 125 V 205 H 155 M 485 135 H 515 V 205 H 485" fill="none" stroke="#1d4ed8" stroke-width="4"/><text x="30" y="330" font-family="sans-serif" font-size="18" fill="#1d4ed8" text-anchor="start">Blue: m0 and m2 join across the left/right edges.</text><text x="30" y="358" font-family="sans-serif" font-size="18" fill="#1d4ed8" text-anchor="start">A = 0 and C = 0 stay fixed; B changes → A̅C̅.</text><text x="30" y="398" font-family="sans-serif" font-size="18" fill="#15803d" text-anchor="start">Green: m3 and m7 join vertically.</text><text x="30" y="426" font-family="sans-serif" font-size="18" fill="#15803d" text-anchor="start">B = 1 and C = 1 stay fixed; A changes → BC.</text><text x="30" y="468" font-family="sans-serif" font-size="22" fill="#172b4d" text-anchor="start">Cover all four 1s: F = A̅C̅ + BC</text></svg>