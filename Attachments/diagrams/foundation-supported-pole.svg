<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Light pole: forces and moment arms</title><desc id="desc">A three metre horizontal pole with upward reactions at ends A and B. A downward one kilonewton load is 1.2 metres from A and 1.8 metres from B. Arrow lengths are not force magnitudes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="30" y="36" font-size="24" text-anchor="start" fill="#182839">Light pole: forces and moment arms</text><line x1="110" y1="210" x2="710" y2="210" stroke="#34495e" stroke-width="3"/><line x1="110" y1="325" x2="110" y2="214" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><line x1="710" y1="325" x2="710" y2="214" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><line x1="350" y1="95" x2="350" y2="205" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="110" y="192" font-size="22" text-anchor="middle" fill="#182839">A</text><text x="710" y="192" font-size="22" text-anchor="middle" fill="#182839">B</text><text x="370" y="125" font-size="22" text-anchor="start" fill="#182839">1 kN</text><text x="83" y="350" font-size="21" text-anchor="start" fill="#182839">R_A</text><text x="684" y="350" font-size="21" text-anchor="start" fill="#182839">R_B</text><line x1="110" y1="255" x2="350" y2="255" stroke="#34495e" stroke-width="3"/><line x1="350" y1="255" x2="710" y2="255" stroke="#34495e" stroke-width="3"/><line x1="110" y1="246" x2="110" y2="264" stroke="#34495e" stroke-width="3"/><line x1="350" y1="246" x2="350" y2="264" stroke="#34495e" stroke-width="3"/><line x1="710" y1="246" x2="710" y2="264" stroke="#34495e" stroke-width="3"/><text x="230" y="285" font-size="20" text-anchor="middle" fill="#182839">1.2 m</text><text x="530" y="285" font-size="20" text-anchor="middle" fill="#182839">1.8 m</text><text x="410" y="390" font-size="20" text-anchor="middle" fill="#182839">Total span = 3.0 m</text></g></svg>