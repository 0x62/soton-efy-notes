<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-labelledby="title desc">
<title id="title">Three-variable Karnaugh map</title><desc id="desc">Rows A equals 0 and 1; columns BC are 00, 01, 11, 10. Ones at A BC 0 11, 1 01, and 1 10. All other cells zero. None of the ones share an edge, including wraparound.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="30" y="36" font-size="24" text-anchor="start" fill="#182839">Three-variable Karnaugh map</text><text x="30" y="73" font-size="22" text-anchor="start" fill="#182839">Example: A̅BC + AB̅C + ABC̅</text><text x="270" y="113" font-size="19" text-anchor="start" fill="#182839">BC →</text><text x="130" y="153" font-size="19" text-anchor="start" fill="#182839">A ↓</text><text x="235" y="153" font-size="20" text-anchor="middle" fill="#182839">00</text><text x="355" y="153" font-size="20" text-anchor="middle" fill="#182839">01</text><text x="475" y="153" font-size="20" text-anchor="middle" fill="#182839">11</text><text x="595" y="153" font-size="20" text-anchor="middle" fill="#182839">10</text><text x="138" y="215" font-size="22" text-anchor="middle" fill="#182839">0</text><rect x="175" y="170" width="120" height="80" fill="#fff" stroke="#34495e" stroke-width="2"/><text x="235" y="218" font-size="24" text-anchor="middle" fill="#182839">0</text><rect x="295" y="170" width="120" height="80" fill="#fff" stroke="#34495e" stroke-width="2"/><text x="355" y="218" font-size="24" text-anchor="middle" fill="#182839">0</text><rect x="415" y="170" width="120" height="80" fill="#e0f1fa" stroke="#34495e" stroke-width="2"/><text x="475" y="218" font-size="24" text-anchor="middle" fill="#182839">1</text><rect x="535" y="170" width="120" height="80" fill="#fff" stroke="#34495e" stroke-width="2"/><text x="595" y="218" font-size="24" text-anchor="middle" fill="#182839">0</text><text x="138" y="295" font-size="22" text-anchor="middle" fill="#182839">1</text><rect x="175" y="250" width="120" height="80" fill="#fff" stroke="#34495e" stroke-width="2"/><text x="235" y="298" font-size="24" text-anchor="middle" fill="#182839">0</text><rect x="295" y="250" width="120" height="80" fill="#e0f1fa" stroke="#34495e" stroke-width="2"/><text x="355" y="298" font-size="24" text-anchor="middle" fill="#182839">1</text><rect x="415" y="250" width="120" height="80" fill="#fff" stroke="#34495e" stroke-width="2"/><text x="475" y="298" font-size="24" text-anchor="middle" fill="#182839">0</text><rect x="535" y="250" width="120" height="80" fill="#e0f1fa" stroke="#34495e" stroke-width="2"/><text x="595" y="298" font-size="24" text-anchor="middle" fill="#182839">1</text><text x="30" y="375" font-size="19" text-anchor="start" fill="#182839">Gray-code columns: only one bit changes between neighbours.</text><text x="30" y="407" font-size="19" text-anchor="start" fill="#182839">The left and right edges are adjacent; diagonals are not.</text><text x="30" y="439" font-size="19" text-anchor="start" fill="#182839">No two 1s are adjacent here, so each remains a single-cell term.</text></g></svg>