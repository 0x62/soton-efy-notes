<svg xmlns="http://www.w3.org/2000/svg" width="850" height="525" viewBox="0 0 850 525" role="img" aria-labelledby="title desc"><title id="title">Latch and flip-flop timing comparison</title><desc id="desc">A data pulse between active clock edges appears at the transparent latch output but not at the flip-flop output. At the next rising edge both receive a one; when data falls during clock high the latch follows while the flip-flop holds one.</desc><rect width="100%" height="100%" fill="white"/><text x="25" y="35" font-family="sans-serif" font-size="23" fill="#172b4d" text-anchor="start">Level-sensitive latch vs rising-edge flip-flop</text><text x="25" y="65" font-family="sans-serif" font-size="17" fill="#172b4d" text-anchor="start">Ideal zero-delay model; both outputs initially 0.</text><path d="M 254 95 V 355" stroke="#94a3b8" stroke-dasharray="5 5"/><text x="254" y="90" font-family="sans-serif" font-size="13" fill="#172b4d" text-anchor="middle">↑ sample</text><path d="M 590 95 V 355" stroke="#94a3b8" stroke-dasharray="5 5"/><text x="590" y="90" font-family="sans-serif" font-size="13" fill="#172b4d" text-anchor="middle">↑ sample</text><rect x="254" y="215" width="168" height="50" fill="#eff6ff"/><rect x="590" y="215" width="168" height="50" fill="#eff6ff"/><text x="25" y="132" font-family="sans-serif" font-size="18" fill="#475569" text-anchor="start">CLK / E</text><polyline points="170,140 254,140 254,110 422,110 422,140 590,140 590,110 758,110 758,140 800,140" fill="none" stroke="#475569" stroke-width="3"/><text x="25" y="192" font-family="sans-serif" font-size="18" fill="#475569" text-anchor="start">D</text><polyline points="170,200 296,200 296,170 338,170 338,200 506,200 506,170 674,170 674,200 800,200" fill="none" stroke="#475569" stroke-width="3"/><text x="25" y="252" font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="start">Latch Q</text><polyline points="170,260 296,260 296,230 338,230 338,260 590,260 590,230 674,230 674,260 800,260" fill="none" stroke="#2563eb" stroke-width="3"/><text x="25" y="312" font-family="sans-serif" font-size="18" fill="#15803d" text-anchor="start">Flip-flop Q</text><polyline points="170,320 590,320 590,290 800,290 800,290" fill="none" stroke="#15803d" stroke-width="3"/><text x="170" y="367" font-family="sans-serif" font-size="16" fill="#172b4d" text-anchor="start">Time → (arbitrary units)</text><text x="25" y="410" font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="start">Blue bands: latch is transparent while E = 1.</text><text x="25" y="439" font-family="sans-serif" font-size="17" fill="#172b4d" text-anchor="start">The first D pulse passes through the latch but is missed by the flip-flop.</text><text x="25" y="468" font-family="sans-serif" font-size="17" fill="#172b4d" text-anchor="start">At the second rising edge both capture 1; only the latch follows D back to 0.</text><text x="25" y="499" font-family="sans-serif" font-size="16" fill="#172b4d" text-anchor="start">Real devices require setup/hold margins and have propagation delay.</text></svg>